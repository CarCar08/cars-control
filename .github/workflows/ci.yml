name: CI

# Builds and tests every push and pull request, and builds the installer to prove the release path works.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build CarsControl.sln -c Release --nologo -v minimal

      - name: Test
        run: dotnet test tests/CarsControl.Tests/CarsControl.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/CarsControl.Tests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Build the installer (proves the release path)
        shell: pwsh
        run: scripts/build-release.ps1 -Version 0.0.0-ci -Output artifacts

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: CarsControl-Setup-ci
          path: |
            artifacts/CarsControl-Setup-*.exe
            artifacts/SHA256SUMS.txt
          retention-days: 7
